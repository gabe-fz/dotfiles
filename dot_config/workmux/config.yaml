# Global workmux config. workmux tracks agent status; its own sidebar is kept
# off and possum (~/.local/bin/possum) shows agents + windows instead.
# The sidebar settings below only apply if you run `workmux sidebar on`.
theme:
  scheme: night-sorbet
  mode: dark

sidebar:
  position: left
  width: 32
  layout: compact
  sort: window
  group_by: session
  enter_action: focus
  dim_stale: false
  collapse_stale: false
  templates:
    compact: "{status_icon} #[fg=#7a8099]{window_index}#[default] {window} {pane_suffix} {fill} {elapsed}"
    grouped:
      header: "#[fg=#c0a6f0,bold]# {group}#[default] {fill} {group_count}"
