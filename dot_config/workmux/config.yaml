# Global workmux config. Sidebar styled to resemble the old muxrail rail:
# agents grouped by tmux session, compact rows, ordered by window. Each row
# shows the agent's window number and name, mirroring the tmux status bar.
theme:
  scheme: night-sorbet
  mode: dark

sidebar:
  position: left
  width: 32
  layout: compact
  sort: window
  group_by: session
  enter_action: focus
  dim_stale: false
  collapse_stale: false
  templates:
    compact: "{status_icon} #[fg=#7a8099]{window_index}#[default] {window} {pane_suffix} {fill} {elapsed}"
    grouped:
      header: "#[fg=#c0a6f0,bold]# {group}#[default] {fill} {group_count}"
