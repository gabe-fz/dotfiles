# Saved by tmux-snapshot. Restore: tmuxp load vlcq
session_name: "vlcq"
windows:
  - window_name: "vlcq"
    start_directory: "~/repos/vlcq"
    layout: main-horizontal
    options:
      main-pane-height: "94%"
    panes:
      - shell_command: []
        start_directory: "~/repos/vlcq"
      - shell_command: []
        start_directory: "~"
