# Saved by tmux-snapshot. Restore: tmuxp load truenas
session_name: "truenas"
windows:
  - window_name: "truenas-sync"
    start_directory: "~/repos/truenas-sync"
    layout: main-horizontal
    options:
      main-pane-height: "50%"
    panes:
      - shell_command: []
        start_directory: "~/repos/truenas-sync"
      - shell_command: []
        start_directory: "~/repos/truenas-sync"
  - window_name: "photos"
    start_directory: "~/repos/photo-ops"
    panes:
      - shell_command: []
        start_directory: "~/repos/photo-ops"
