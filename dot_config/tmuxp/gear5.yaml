# Saved by tmux-snapshot. Restore: tmuxp load gear5
session_name: "gear5"
windows:
  - window_name: "bikefit"
    start_directory: "~/repos/gear5"
    layout: main-vertical
    options:
      main-pane-width: "49%"
    panes:
      - shell_command: []
        start_directory: "~/repos/gear5"
      - shell_command: []
        start_directory: "~/repos/gear5"
  - window_name: "overdrive"
    start_directory: "~/repos/gear5"
    layout: main-horizontal
    options:
      main-pane-height: "94%"
    panes:
      - shell_command: []
        start_directory: "~/repos/gear5"
      - shell_command: []
        start_directory: "~"
