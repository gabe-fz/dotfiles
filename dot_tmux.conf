# rebind prefix to Ctrl-x
unbind C-b
set -g prefix C-x

# turn on pane titles, optional auto-title
set -g pane-border-status top
set -g pane-border-format "#{pane_index} #{pane_title}"

# start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# turn on mouse support
set -g mouse on

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Set the default terminal
set -g default-terminal tmux-256color

# Let applications set the system clipboard with OSC 52. The default
# `external` forwards tmux's own copies but *ignores* application escape
# sequences, so copy-to-clipboard in TUI apps (leap's y, etc.) silently
# no-ops. Also makes tmux copy-mode selections land on the real clipboard.
set -g set-clipboard on

# Let applications send escape sequences straight through to Ghostty (wrapped
# in tmux's DCS envelope). Needed for the Kitty graphics protocol, which tmux
# doesn't speak natively: images are transmitted once and then anchored to
# U+10EEEE placeholder cells, which tmux scrolls and redraws as ordinary text.
# Tradeoff: programs in a pane can address the outer terminal directly,
# bypassing tmux's sanitization.
set -g allow-passthrough on

# Inside tmux, prefer Kitty graphics over Sixel for leap's diagrams. Sixel is
# auto-detected first (tmux advertises it in DA1) but re-transmits the whole
# image on every scroll frame; Kitty graphics places it once. Only set inside
# tmux — bare Ghostty auto-detects Kitty graphics on its own.
set-environment -g LEAP_IMAGE_PROTOCOL tgp

# macOS clipboard: pipe every tmux selection to pbcopy so a mouse drag (or
# copy-mode copy) lands on the system clipboard immediately — Cmd-V then works
# anywhere. Direct pbcopy instead of relying on OSC 52 alone: it works even
# when the escape sequence gets swallowed (ssh, nested sessions).
bind -T copy-mode      MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi   MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode      C-c               send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi   y                 send-keys -X copy-pipe-and-cancel "pbcopy"

# Extended keys: pass modified keys (Shift+Enter, Ctrl+Enter, ...) through to
# applications that ask for them (Claude Code does) instead of flattening them
# to plain Enter. terminal-features tells tmux the *outer* terminal
# (xterm-ghostty) can carry them.
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

# Don't sit on a lone ESC waiting for an escape sequence (default 500ms).
# Keeps ESC-prefixed input like Ghostty's Shift+Enter (ESC CR) snappy and
# unambiguous for the app underneath.
set -s escape-time 10
