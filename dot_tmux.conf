# rebind prefix to Ctrl-x
unbind C-b
set -g prefix C-x

# turn on pane titles, optional auto-title
set -g pane-border-status top
set -g pane-border-format "#{pane_index} #{pane_title}"

# start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Enable tmux mouse support. This keeps tmux's built-in right-click context
# menu, while forwarding right-clicks to applications that have requested mouse
# tracking (for example, terminal UIs and browsers).
set -g mouse on

# Horizontal wheel gestures are reported by terminals as Shift+Wheel. Forward
# them to mouse-aware applications rather than treating them as tmux scrollback.
# tmux has no horizontal scrollback viewport of its own.
bind -n S-WheelUpPane send-keys -M
bind -n S-WheelDownPane send-keys -M

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Set the default terminal
set -g default-terminal tmux-256color

# Let applications set the system clipboard with OSC 52. The default
# `external` forwards tmux's own copies but *ignores* application escape
# sequences, so copy-to-clipboard in TUI apps (leap's y, etc.) silently
# no-ops. Also makes tmux copy-mode selections land on the real clipboard.
set -g set-clipboard on

# Let applications send escape sequences straight through to Ghostty (wrapped
# in tmux's DCS envelope). Needed for the Kitty graphics protocol, which tmux
# doesn't speak natively: images are transmitted once and then anchored to
# U+10EEEE placeholder cells, which tmux scrolls and redraws as ordinary text.
# Tradeoff: programs in a pane can address the outer terminal directly,
# bypassing tmux's sanitization.
set -g allow-passthrough on

# Inside tmux, prefer Kitty graphics over Sixel for leap's diagrams. Sixel is
# auto-detected first (tmux advertises it in DA1) but re-transmits the whole
# image on every scroll frame; Kitty graphics places it once. Only set inside
# tmux — bare Ghostty auto-detects Kitty graphics on its own.
set-environment -g LEAP_IMAGE_PROTOCOL tgp

# macOS clipboard: pipe every tmux selection to pbcopy so a mouse drag (or
# copy-mode copy) lands on the system clipboard immediately — Cmd-V then works
# anywhere. Direct pbcopy instead of relying on OSC 52 alone: it works even
# when the escape sequence gets swallowed (ssh, nested sessions).
bind -T copy-mode      MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi   MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode      C-c               send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi   y                 send-keys -X copy-pipe-and-cancel "pbcopy"

# Extended keys: pass modified keys (Shift+Enter, Ctrl+Enter, ...) through to
# applications that ask for them (Claude Code does) instead of flattening them
# to plain Enter. terminal-features tells tmux the *outer* terminal
# (xterm-ghostty) can carry them.
set -s extended-keys always
set -s extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

# Don't sit on a lone ESC waiting for an escape sequence (default 500ms).
# Keeps ESC-prefixed input like Ghostty's Shift+Enter (ESC CR) snappy and
# unambiguous for the app underneath.
set -s escape-time 10

# --- Window management (alongside the workmux agent sidebar) ---------------
# Replaces muxrail. possum is the left sidebar (workmux agents + all
# windows); workmux still tracks agent status, but its own sidebar stays off.

# Closing the session you're in moves you to another one instead of detaching.
set -g detach-on-destroy off

# Possum sidebar toggle (prefix + Ctrl-t)
bind C-t run-shell "~/.local/bin/possum toggle"

# Keep one possum pane per window: add it to new windows, re-fix its width,
# close a window once only its possum is left. Index 50 leaves other tools' hooks alone.
set-hook -g after-new-window[50] 'run-shell -b "~/.local/bin/possum sync"'
set-hook -g after-new-session[50] 'run-shell -b "~/.local/bin/possum sync"'
set-hook -g after-kill-pane[50] 'run-shell -b "~/.local/bin/possum sync"'
set-hook -g pane-exited[50] 'run-shell -b "~/.local/bin/possum sync"'
set-hook -g client-resized[50] 'run-shell -b "~/.local/bin/possum sync"'

# Fuzzy window manager across all sessions: switch / rename / close / new.
# Overrides tmux's built-in find-window on `prefix f`.
bind f display-popup -E -w 85% -h 80% -T " windows " "~/.local/bin/tmux-windows"

# Save all sessions as tmuxp workspaces (restore with `tmuxp load <name>`).
bind S run-shell "~/.local/bin/tmux-snapshot >/dev/null && tmux display 'tmux-snapshot: sessions saved to ~/.config/tmuxp'"

# No status bar: possum (left) lists sessions and windows.
set -g status off

# Don't auto-rename a window to "workmux" when its sidebar pane has focus.
# Claude Code's process name is its version (e.g. 2.1.326): show "claude".
set -g automatic-rename-format "#{?#{||:#{@possum_role},#{==:#{pane_current_command},workmux}},#{window_name},#{?#{m/r:^[0-9]+[.][0-9]+[.][0-9]+$,#{pane_current_command}},claude,#{pane_current_command}}}"

# --- Pane title bar buttons (replaces muxrail's top bar) --------------------
# Each pane's top border: ▶ index command | dir, then click targets:
#   [←][↓][↑][→] split that way  [Z] zoom  [×] close  ≡ pane menu
# Right-click a border for the same menu. The possum pane only gets
# its name. Splits open in the clicked pane's directory.
set -g pane-border-format "#{?#{@possum_role},#[fg=#c0a6f0] possum ,#{?pane_active,#[fg=#9ece6a]▶ ,#[fg=#7a8099]}#{pane_index} #{?#{m/r:^[0-9]+[.][0-9]+[.][0-9]+$,#{pane_current_command}},claude,#{pane_current_command}} | #{b:pane_current_path}#[default]#[align=right]#[fg=#c0a6f0]#{?#{e|>=:#{pane_width},60}, #[range=control|1][←]#[norange] #[range=control|5][↓]#[norange] #[range=control|2][↑]#[norange] #[range=control|6][→]#[norange] #[range=control|8][Z]#[norange] #[range=control|3][×]#[norange],} #[range=control|0]≡#[norange] }"

bind -n MouseDown1Control1 split-window -bh -c "#{W:#{P:#{?#{==:#{pane_id},#{mouse_pane}},#{pane_current_path},}}}" -t =
bind -n MouseDown1Control2 split-window -bv -c "#{W:#{P:#{?#{==:#{pane_id},#{mouse_pane}},#{pane_current_path},}}}" -t =
bind -n MouseDown1Control5 split-window -v -c "#{W:#{P:#{?#{==:#{pane_id},#{mouse_pane}},#{pane_current_path},}}}" -t =
bind -n MouseDown1Control6 split-window -h -c "#{W:#{P:#{?#{==:#{pane_id},#{mouse_pane}},#{pane_current_path},}}}" -t =
bind -n MouseDown1Control8 resize-pane -Z -t =
bind -n MouseDown1Control3 run-shell 'tmux confirm-before -p "close pane #{pane_index} (#{pane_current_command})? (y/n)" "kill-pane -t #{mouse_pane}"'
bind -n MouseDown1Control0 display-menu -t = -x M -y M -T "#[align=centre] pane #{pane_index} " \
  "Split right" r { split-window -h -c "#{pane_current_path}" } \
  "Split left"  l { split-window -bh -c "#{pane_current_path}" } \
  "Split down"  d { split-window -v -c "#{pane_current_path}" } \
  "Split up"    u { split-window -bv -c "#{pane_current_path}" } \
  "" \
  "#{?window_zoomed_flag,Unzoom,Zoom}" z { resize-pane -Z } \
  "Swap up"     U { swap-pane -U } \
  "Swap down"   D { swap-pane -D } \
  "Move to new window" b { break-pane } \
  "" \
  "Windows…"    f { display-popup -E -w 85% -h 80% -T " windows " "~/.local/bin/tmux-windows" } \
  "Toggle possum sidebar" s { run-shell "~/.local/bin/possum toggle" } \
  "" \
  "Close pane"  x { confirm-before -p "close pane? (y/n)" kill-pane }
bind -n MouseDown3Border select-pane -t = \; display-menu -t = -x M -y M -T "#[align=centre] pane #{pane_index} " \
  "Split right" r { split-window -h -c "#{pane_current_path}" } \
  "Split down"  d { split-window -v -c "#{pane_current_path}" } \
  "#{?window_zoomed_flag,Unzoom,Zoom}" z { resize-pane -Z } \
  "Close pane"  x { confirm-before -p "close pane? (y/n)" kill-pane }

# Keyboard splits open in the current pane's directory too.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
